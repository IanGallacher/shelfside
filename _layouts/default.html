<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="/assets/css/styles.css" as="style">
    <link rel="stylesheet" href="/assets/css/styles.css">

    {% comment %}
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
      <title>
        {% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{
        site.title }}{% endif %}
      </title>
      <!--  -->
      {% feed_meta %} {% seo %}
    {% endcomment %}
  </head>
  <body>
    {% include header.html %}
    {% include navigation.html %}
    <!--  -->
    {{ content }}
    <!--  -->
    {% include footer.html %}
  </body>
</html>
